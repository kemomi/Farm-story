name: Build APK & Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release 版本号（如 v0.0.2）'
        required: true
        default: 'v0.0.2'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Rename APK
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/farm-game-v0.0.2-android15.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: ${{ github.event.inputs.version }}
          body: |
            ## 牧场物语 v0.0.2 — Android 15 安装包

            ### 新增内容
            - 🎵 背景音乐（BGM）：过程化合成的舒缓牧场旋律，循环播放
            - 🔊 音效系统（9 种）：收获/播种/锄地/金币/升级/浇水/钓鱼/点击/睡觉
            - ✨ 粒子特效：收获金光、播种尘土、锄地飞溅、金币飞舞、升级星爆、水花
            - 🌾 农作物生长动画：随风摇摆、成熟脉冲呼吸光圈、感叹号弹跳
            - ☁️ 环境动画：云朵漂移、水面涟漪扩散、水面闪光
            - 🧑 NPC 呼吸动效
            - 🔇 音频开关按钮：BGM/音效独立控制

            ### 技术信息
            - 目标平台：Android 15 (API 35)
            - 架构：arm64-v8a
            - 构建模式：release
            - 安装包：`farm-game-v0.0.2-android15.apk`
          files: |
            build/app/outputs/flutter-apk/farm-game-v0.0.2-android15.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
